name: Static checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  static-checks:
    name: "Static checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Scony/godot-gdscript-toolkit@master
      - name: Format
        run: gdformat --check .
      - name: Lint
        run: gdlint .
      - name: Fail if any commit message contains 'wip/fixup/no_ci' since main
        run: |
          if git log --pretty=%B origin/main..HEAD | grep -Eiq 'wip|fixup|no_ci'; then
            echo "Linting blocked: commit message contains '[wip|fixup|no_ci]'."
            exit 1
          fi
